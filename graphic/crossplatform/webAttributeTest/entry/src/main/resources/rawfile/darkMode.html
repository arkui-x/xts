
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>原始网页</title>
    <style>
        body {
          padding: 40px;
          font-size: 18px;
        }

        /* 浅色样式 */
        @media (prefers-color-scheme: light) {
          body { background: LightBlue; color: red; }
        }

        /* 深色样式 */
        @media (prefers-color-scheme: dark) {
          body { background: yellow; color: Brown; }
        }
    </style>
</head>
<body>
<h3>原始测试页面</h3>
<p>深色模式测试</p>
<script>
  // 返回当前网页的配色状态（媒体查询字段）
  // media=light 表示浅色，media=dark 表示深色或强制深色
  function getColorScheme() {
    let media = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    return 'media=' + media;
  }
</script>
</body>
</html>
