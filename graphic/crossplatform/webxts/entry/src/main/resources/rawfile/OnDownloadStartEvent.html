<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
		/>
		<title>download</title>
		<script type="text/javascript">
			function triggerDownload() {
				const anchor = document.getElementById('downloadFile');
				anchor.click();
			}
			window.onload = triggerDownload;
		</script>
	</head>
	<body>
		<h1>WebView onDownloadStart Demo</h1>
		<a
			id="downloadFile"
			href="https://mirrors.tuna.tsinghua.edu.cn/gnu/aspell/aspell-0.50-vc%2B%2B.diff.gz"
			download="aspell-0.50-vc++.diff.gz"
			>download</a
		>
	</body>
</html>
