<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>setNetworkAvailable test</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      color: #18202a;
      background: #f7f9fb;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.3;
    }

    .result {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
  <script>
    function refreshNetworkAvailableState() {
      let online = String(window.navigator.onLine);
      let result = 'navigator.onLine=' + online;
      let element = document.getElementById('onlineValue');
      if (element) {
        element.textContent = result;
      }
      return online;
    }

    window.refreshNetworkAvailableState = refreshNetworkAvailableState;
    window.addEventListener('load', refreshNetworkAvailableState);
    window.addEventListener('online', refreshNetworkAvailableState);
    window.addEventListener('offline', refreshNetworkAvailableState);
  </script>
</head>
<body>
  <h1>setNetworkAvailable HTML probe</h1>
  <div id="onlineValue" class="result">navigator.onLine=-</div>
</body>
</html>
