<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cross Platform Crash Test</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --subtle: #5b6472;
      --accent: #b42318;
      --warn-bg: #fff1f0;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: linear-gradient(180deg, #fbfdff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.45;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    p {
      margin: 0 0 10px;
      color: var(--subtle);
      font-size: 14px;
    }

    .warn {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--warn-bg);
      color: var(--accent);
      font-size: 13px;
    }

    .metric {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fafafa;
    }

    .metric-label {
      font-size: 12px;
      color: var(--subtle);
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
      word-break: break-all;
    }

    #status {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #7a0916;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cross-platform Web crash page</h1>
    <p>页面加载 2 秒后自动执行「数组爆炸」，构造超大数组以触发 Web 进程崩溃（onRenderExited）。</p>
    <div class="warn">该页面会自动发起数组爆炸，仅用于崩溃测试。</div>

    <div id="status">状态：页面初始化中...</div>
  </div>

  <script>
    (function () {
      let statusNode = document.getElementById('status');

      function setStatus(message) {
        statusNode.textContent = '状态：' + message;
      }

      function crashString() {
        setStatus('构造超大数组并 fill 实体化内存...');
        let hold = [];
        while (true) {
          try {
            let a = new Array(50 * 1000 * 1000);
            a.fill(0);
            hold.push(a);
          } catch (e) {
            setStatus('数组分配失败(内存耗尽): ' + e);
            try {
              while (true) {
                hold.push(new Float64Array(8 * 1024 * 1024));
              }
            } catch (error) {
              setStatus('出现异常: ' + error);
            }
          }
        }
      }

      window.addEventListener('load', function () {
        setStatus('2 秒后自动执行数组爆炸...');
        setTimeout(crashString, 2000);
      });
    })();
  </script>
</body>
</html>
